<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jadwal Lapangan - ArenaKu</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="jadwal">
  <div id="site-header"></div>

  <div class="page-head">
    <div class="container">
      <h1>Jadwal Lapangan</h1>
      <p>Lihat jam yang masih kosong di setiap lapangan. Terbuka untuk umum, tanpa login.</p>
    </div>
  </div>

  <div class="container">
    <div class="card toolbar">
      <div class="field"><label for="j-prov">Provinsi</label><select id="j-prov"></select></div>
      <div class="field"><label for="j-kota">Kota / Kabupaten</label><select id="j-kota"></select></div>
      <div class="field"><label for="j-venue">Venue</label><select id="j-venue"></select></div>
      <div class="field"><label for="j-lap">Lapangan</label><select id="j-lap"></select></div>
    </div>

    <div class="jadwal-grid" style="margin:20px 0 64px">
      <div class="card"><h2 style="font-size:1.1rem;margin-bottom:10px">Pilih tanggal</h2><div class="cal-wrap" id="j-kalender"></div></div>
      <div class="card">
        <div class="hasil-bar">
          <div><h2 id="j-judul" style="font-size:1.2rem"></h2><p class="muted small" id="j-info"></p></div>
          <a href="#" class="btn btn-primary btn-sm" id="j-booking">Booking di venue ini</a>
        </div>
        <div id="j-legend"></div>
        <div id="j-slots"></div>
      </div>
    </div>
  </div>

  <div id="site-footer"></div>
  <script src="js/app.js"></script>
  <script src="js/calendar.js"></script>
  <script src="js/jadwal.js"></script>
</body>
</html>
